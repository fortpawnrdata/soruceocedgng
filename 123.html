<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zorbs</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: rgb(26, 26, 26);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 6rem;
    font-weight: bold;
    margin: 0;
  }

  .buttons {
    display: flex;
    gap: 1.5rem;
  }

  button {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 0.75rem 2rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  button:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }

  .cleaner-btn {
    background-color: #FFD700;
    color: #1a1a1a;
  }

  .download-btn {
    background-color: #FFFFFF;
    color: #1a1a1a;
  }

  .yellow {
    color: #FFD700;
  }

  .white {
    color: #FFFFFF;
  }

  h1 {
    animation: popIn 1s ease forwards;
  }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: scale(0.5);
    }
    60% {
      opacity: 1;
      transform: scale(1.1);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h1><span class="yellow">Zor</span><span class="white">bs</span></h1>
    <div class="buttons">
      <button class="cleaner-btn">Cleaner</button>
      <button class="download-btn">Updates</button>
    </div>
  </div>
</body>
</html>
